name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # The full 1,000-operation concurrency run happens on Linux; the other
      # systems run the same test with fewer operations to keep the job short.
      - name: Test (full)
        if: runner.os == 'Linux'
        run: go test ./... -count=1 -race -timeout 20m
      - name: Test (short)
        if: runner.os != 'Linux'
        run: go test ./... -count=1 -short -timeout 20m
