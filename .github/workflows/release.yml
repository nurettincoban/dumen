# Builds the dumen binaries for a version tag (v0.1.0, ...) and attaches them to a GitHub
# release. The Claude Code plugin downloads them from there, so a tag is all a release
# needs. It uses only the repository's own GITHUB_TOKEN.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -eu
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/nurettincoban/dumen/internal/cli.Version=${GITHUB_REF_NAME#v}" \
              -o "dist/dumen_${os}_${arch}${ext}" ./cmd/dumen
          done
          (cd dist && sha256sum dumen_* > checksums.txt)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
