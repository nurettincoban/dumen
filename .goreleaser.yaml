# Release configuration. Run locally with:
#   goreleaser release --clean          (needs a git tag and GITHUB_TOKEN)
#   goreleaser release --snapshot --clean   (dry run, publishes nothing)
version: 2

project_name: dumen

before:
  hooks:
    - go mod tidy
    - go test ./... -short

builds:
  - id: dumen
    main: ./cmd/dumen
    binary: dumen
    env:
      - CGO_ENABLED=0 # one static binary, no libc dependency
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nurettincoban/comm-pro/internal/cli.Version={{ .Version }}

archives:
  - id: dumen
    formats: [tar.gz]
    name_template: "dumen_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# Homebrew: brew install --cask nurettincoban/tap/dumen
# Needs the repository nurettincoban/homebrew-tap and a token that can push to it.
# The binary is not notarized: until it is, macOS users may need
#   xattr -dr com.apple.quarantine "$(which dumen)"
homebrew_casks:
  - name: dumen
    repository:
      owner: nurettincoban
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/nurettincoban/comm-pro
    description: Steer and monitor your team's Claude Code agents through your git remote

# Scoop: scoop bucket add dumen https://github.com/nurettincoban/scoop-bucket && scoop install dumen
# Needs the repository nurettincoban/scoop-bucket and a token that can push to it.
scoops:
  - name: dumen
    repository:
      owner: nurettincoban
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/nurettincoban/comm-pro
    description: Steer and monitor your team's Claude Code agents through your git remote
    license: Apache-2.0

release:
  draft: true # review the release notes before publishing
